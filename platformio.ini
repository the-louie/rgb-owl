; RGB Owl light sign — see SPEC.md / AGENTS.md

[platformio]
default_envs = s3zero

; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4 MB flash, 2 MB quad PSRAM)
[env:s3zero]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
; two 1.9 MB OTA app slots, no filesystem needed (web UI is embedded)
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.9.0
    tzapu/WiFiManager@^2.0.17

; host-side unit tests for hardware-independent logic (lib/)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
