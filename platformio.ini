; RGB Owl light sign — see SPEC.md / AGENTS.md

[platformio]
default_envs = s3zero
; local secrets, never committed: copy secrets.ini.example to secrets.ini
extra_configs = secrets*.ini

; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4 MB flash, 2 MB quad PSRAM)
[env:s3zero]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
; two 1.9 MB OTA app slots, no filesystem needed (web UI is embedded)
board_build.partitions = min_spiffs.csv
; ESP32-S3FH4R2: quad flash + 2 MB quad PSRAM (heap for BLE + WiFi + TLS)
board_build.arduino.memory_type = qio_qspi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    '-DOWL_OTA_PASSWORD="${owl_secrets.ota_password}"'
    -DOWL_BLE_PIN=${owl_secrets.ble_pin}
monitor_speed = 115200
; OWL_VERSION from git describe (tags vX.Y.Z)
extra_scripts = post:tools/version.py
; web UI source, linked into flash as _binary_web_index_html_start (NUL-terminated)
board_build.embed_txtfiles = web/index.html
; root CAs for HTTPS update downloads (tools/gen-crt-bundle.sh)
board_build.embed_files = data/x509_crt_bundle.bin
lib_deps =
    fastled/FastLED@3.9.20  ; 3.10.x falls back to bit-banging on IDF 4.4 (no RMT)
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@1.4.3  ; 1.x API, supports Arduino core 2.0.x

; same firmware, uploaded over WiFi: pio run -e s3zero-ota -t upload
[env:s3zero-ota]
extends = env:s3zero
upload_protocol = espota
upload_port = owl.local
upload_flags = --auth=${owl_secrets.ota_password}

; host-side unit tests for hardware-independent logic (lib/)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
